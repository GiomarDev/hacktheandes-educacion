name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# prisma generate exige las URLs aunque no se conecte; las e2e usan el Postgres del servicio.
env:
  AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=auth
  SIAGIE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=siagie
  ALERTA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=alerta
  SIMON_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=simon
  ESCALE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=escale
  AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=auth_test
  SIAGIE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=siagie_test
  ALERTA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=alerta_test
  SIMON_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=simon_test
  ESCALE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school?schema=escale_test
  AUTH_JWKS_URL: http://localhost:3000/.well-known/jwks.json
  AUTH_URL: http://localhost:3000
  SIAGIE_URL: http://localhost:3001
  ALERTA_URL: http://localhost:3002
  SIMON_URL: http://localhost:3003
  BACKGROUND_JOBS_ENABLED: 'false'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # npm 11 omite los scripts de instalación sin allowScripts: rebuild los ejecuta.
      - run: npm ci && npm rebuild
      - name: Secretos efímeros de prueba
        run: |
          echo "KEY_ENCRYPTION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SIMON_DATA_ENCRYPTION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "INTERNAL_API_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "SEED_PASSWORD=$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - name: Clientes de Prisma
        run: for s in auth siagie alerta simon escale; do npm run "$s:generate"; done
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Secuencial: las suites comparten y limpian los schemas _test.
      - run: npm run test:e2e
      - run: npm run test:smoke

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm rebuild
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/backend.Dockerfile -t amauti-backend .
      - run: docker build -f deploy/web.Dockerfile -t amauti-web .
